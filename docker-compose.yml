version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    ports:          #]
      - "3306:3306" #]DB開放外網 正式環境需移除這兩行
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: isolation_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  my-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__DefaultConnection=Server=mysql;Database=isolation_db;Uid=root;Pwd=rootpassword;Port=3306;AllowUserVariables=true;
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql_data:
